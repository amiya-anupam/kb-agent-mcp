[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-agent-mcp"
version = "1.0.1"
description = "A zero-config MCP server that turns any folder of documents into a queryable multi-agent knowledge base"
readme = "README-MCP.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "KnowledgeBase Agent Contributors" }]
keywords = ["mcp", "ai", "knowledge-base", "rag", "agents", "llm", "data-analyst"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core dependencies (always installed) ─────────────────────────────────────
dependencies = [
    "fastmcp>=2.0.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "watchdog>=4.0.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "sentence-transformers>=3.0.0",
]

# ── Optional extras ────────────────────────────────────────────────────────────
[project.optional-dependencies]
# pip install kb-agent-mcp[openai]
openai = ["openai>=1.0.0"]

# pip install kb-agent-mcp[anthropic]
anthropic = ["anthropic>=0.30.0"]

# pip install kb-agent-mcp[dev]  — for contributors
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage      = "https://github.com/amiya-anupam/kb-agent-mcp"
Repository    = "https://github.com/amiya-anupam/kb-agent-mcp"
"Bug Tracker" = "https://github.com/amiya-anupam/kb-agent-mcp/issues"

# ── CLI entry points ───────────────────────────────────────────────────────────
[project.scripts]
kb-agent          = "kb_agent_mcp.cli.main:main"
kb-agent-setup    = "kb_agent_mcp.cli.setup:main"
kb-agent-generate = "kb_agent_mcp.cli.generate:main"
kb-agent-serve    = "kb_agent_mcp.server:main"
kb-agent-watch    = "kb_agent_mcp.cli.watch:main"
kb-agent-doctor   = "kb_agent_mcp.cli.doctor:main"
kb-agent-status   = "kb_agent_mcp.cli.status:main"

# ── Package discovery ─────────────────────────────────────────────────────────
# Only the kb_agent_mcp/ Python package is included in the wheel.
# tests/, scripts/, agents/, and all other top-level directories are
# development/contributor resources — not shipped to end users.
[tool.setuptools.packages.find]
where = ["."]
include = ["kb_agent_mcp*"]

# ── Wheel: exclude non-package data from the installed distribution ───────────
[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__"]

# ── pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: Auto-update Changelog

on:
  push:
    branches:
      - main
    # Don't trigger on changes that only touch README.md
    # (prevents an infinite loop where the bot's own commit re-triggers the workflow)
    paths-ignore:
      - "README.md"

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the README change back

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git log sees all commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run changelog updater
        run: python3 scripts/update_changelog.py

      - name: Commit & push updated README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: update changelog [skip ci]" &&
            git push
          )

name: Test, bump version, and publish to PyPI

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: run the test suite ──────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -q

  # ── Job 2: bump version, build, publish ───────────────────────────────────
  publish:
    name: Bump version, build, and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the version-bump commit back to github.com
      id-token: write  # needed for PyPI Trusted Publishing (OIDC)

    environment:
      name: pypi
      url: https://pypi.org/p/kb-agent-mcp

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Auto-bump patch version
        id: bump
        run: |
          CURRENT=$(python3 -c "
          import re, pathlib
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M)
          print(m.group(1))
          ")
          echo "Current version: $CURRENT"

          NEW=$(python3 -c "
          parts = '$CURRENT'.split('.')
          parts[-1] = str(int(parts[-1]) + 1)
          print('.'.join(parts))
          ")
          echo "New version: $NEW"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Build distribution
        run: python3 -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Authenticates via OIDC Trusted Publishing — no PYPI_TOKEN secret needed

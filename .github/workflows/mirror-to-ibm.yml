name: Mirror to IBM GHE

on:
  # Fire only after the publish workflow completes — this guarantees the
  # version-bump commit has already been pushed back to main before we mirror.
  workflow_run:
    workflows: ["Test, bump version, and publish to PyPI"]
    types: [completed]
    branches: [main]

jobs:
  mirror-to-ibm:
    name: Push to IBM GHE
    runs-on: ubuntu-latest
    # Skip the mirror if the publish workflow itself failed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0  # full history
          ref: main       # fetch latest main — includes the version-bump commit

      - name: Configure SSH deploy key for IBM GHE
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IBM_GHE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.ibm.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host github.ibm.com
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Push mirror to IBM GHE
        run: |
          git remote add ibm git@github.ibm.com:Amiya-Anupam1/kb-agent-mcp.git
          git push ibm main --force

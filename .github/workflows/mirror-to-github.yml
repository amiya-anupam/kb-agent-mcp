name: Bump version, test, and mirror to github.com

on:
  push:
    branches: [main]

jobs:
  bump-test-mirror:
    name: Bump version → test → push to github.com
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the version-bump commit back to IBM GHE

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

      - name: Auto-bump patch version
        id: bump
        run: |
          CURRENT=$(python3 -c "
          import re, pathlib
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M)
          print(m.group(1))
          ")
          echo "Current version: $CURRENT"

          NEW=$(python3 -c "
          parts = '$CURRENT'.split('.')
          parts[-1] = str(int(parts[-1]) + 1)
          print('.'.join(parts))
          ")
          echo "New version: $NEW"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump to IBM GHE
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Configure SSH deploy key for github.com
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIRROR_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host github.com
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Push mirror to github.com (triggers publish.yml there)
        run: |
          git remote add public git@github.com:amiya-anupam/kb-agent-mcp.git
          git push public main --force
